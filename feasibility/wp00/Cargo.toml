[package]
name = "minimalmonitor-wp00"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
axum = { version = "0.8.6", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6.1", features = ["all"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
