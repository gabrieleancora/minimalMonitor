[package]
name = "minimalmonitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "password-hash"] }
getrandom = "=0.4.3"
hmac = "=0.12.1"
ipnet = "=2.11.0"
rpassword = "=7.5.4"
sha2 = "=0.10.9"
subtle = "=2.6.1"
zeroize = { version = "=1.8.2", features = ["serde"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
fs2 = "=0.4.3"
hyper = { version = "=1.12.0", default-features = false, features = ["server", "client", "http1"] }
http-body-util = { version = "=0.1.5", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = { version = "=1.0.9", default-features = false }
serde_json = "=1.0.151"
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "backup", "limits"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["test-util"] }
tempfile = "=3.27.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO"] }

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "=0.6.5", features = ["all"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[example]]
name = 'gui-review'
path = 'validation/wp05/fixture.rs'
